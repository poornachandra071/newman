name: API Tests

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: '30 2 * * *'        # 02:30 UTC = 08:00 AM IST, every day
  workflow_dispatch:            # manual "Run workflow" button

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman
        run: npm install -g newman

      - name: Run the API tests
        run: |
          mkdir -p reports
          newman run postman/comments-api.postman_collection.json \
            --env-var "baseUrl=https://jsonplaceholder.typicode.com" \
            --delay-request 300 --timeout-request 15000 \
            -r cli,junit --reporter-junit-export reports/results.xml

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-reports
          path: reports